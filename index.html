---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claire Shin</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0A1428;
      --heading: #B7CBE8;
      --text: #E8ECF2;
      --text-mid: rgba(232,236,242,0.62);
      --text-dim: rgba(232,236,242,0.4);
      --card-border: rgba(232,236,242,0.16);
      --card-desc: rgba(232,236,242,0.6);
      --accent: #8ECDF0;
      --accent-dim: rgba(142,205,240,0.5);
    }
    :root.light {
      --bg: #eef2f7;
      --heading: #00205B;
      --text: #0A1E3F;
      --text-mid: #5B6770;
      --text-dim: rgba(10,30,63,0.42);
      --card-border: #D9DDE3;
      --card-desc: #33404F;
      --accent: #3E9FD8;
      --accent-dim: rgba(62,159,216,0.4);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── NAV ── */
    .nav {
      padding: 22px 32px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      transition: border-color 0.3s ease;
    }
    .nav-left a {
      color: var(--heading);
      text-decoration: none;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.1px;
    }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav-links a {
      color: var(--text-mid);
      text-decoration: none;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .theme-toggle {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 0;
      cursor: pointer;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 6px 10px;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover { color: var(--accent); border-color: var(--accent); }

    /* ── HEADER ── */
    .header {
      padding: 56px 32px 36px;
      max-width: 860px;
      margin: 0 auto;
    }
    .header p {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 17px;
      color: var(--text-mid);
      font-weight: 400;
    }

    /* ── POSTS ── */
    .posts {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }
    .posts-header {
      display: flex;
      align-items: baseline;
      margin-bottom: 4px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }
    .posts-label {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
    }
    .post-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 20px;
    }
    .post-item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 24px 28px;
      background: transparent;
      border: 1px solid var(--card-border);
      transition: border-color 0.25s ease;
      opacity: 0;
      transform: translateY(12px);
    }
    .post-item.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .post-item:hover {
      border-color: var(--accent);
    }
    .post-date {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-style: italic;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .post-title {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(19px, 2.2vw, 23px);
      font-weight: 700;
      letter-spacing: -0.2px;
      line-height: 1.3;
      color: var(--heading);
      margin-bottom: 8px;
      transition: color 0.2s;
    }
    .post-item:hover .post-title { color: var(--accent); }
    .post-excerpt {
      font-size: 14.5px;
      line-height: 1.7;
      color: var(--card-desc);
      font-weight: 400;
    }

    /* ── PARTICLE BG ── */
    #particle-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .nav, .header, .posts { position: relative; z-index: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .header, .posts { padding-left: 20px; padding-right: 20px; }
      .nav { padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <canvas id="particle-bg"></canvas>
  <nav class="nav">
    <div class="nav-left"><a href="/">Claire Shin</a></div>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/about/">About</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
        <span class="icon" id="theme-icon">☀</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </nav>

  <div class="header">
    <p>Learning notes.</p>
  </div>

  <div class="posts">
    <div class="posts-header">
      <div class="posts-label">Writing</div>
    </div>
    <div class="post-list">
      {% for post in site.posts %}
      <a class="post-item" href="{{ post.url }}" data-delay="{{ forloop.index0 | times: 80 }}">
        <div class="post-date">{{ post.date | date: "%B %d, %Y" }}</div>
        <div class="post-title">{{ post.title }}</div>
        <div class="post-excerpt">{{ post.content | strip_html | truncatewords: 40 }}</div>
      </a>
      {% endfor %}
    </div>
  </div>

  <script>
    // Theme toggle
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    const root = document.documentElement;
    function setTheme(mode) {
      if (mode === 'light') { root.classList.add('light'); icon.textContent = '☾'; label.textContent = 'Dark'; }
      else { root.classList.remove('light'); icon.textContent = '☀'; label.textContent = 'Light'; }
      localStorage.setItem('theme', mode);
    }
    toggle.addEventListener('click', () => setTheme(root.classList.contains('light') ? 'dark' : 'light'));
    const saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);

    // ═══════════════ SPHERE COLOR ═══════════════
    const sphereColor = { dark: [180,220,245], light: [130,190,230] };

    // ═══════════════ PARTICLE SPHERE ═══════════════
    (function() {
      const canvas = document.getElementById('particle-bg');
      const ctx = canvas.getContext('2d');
      let w, h, dpr;
      const NUM = 2000;
      const points = [];
      let angleX = 0, angleY = 0;

      // generate points on a sphere using fibonacci spiral
      for (let i = 0; i < NUM; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / NUM);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        points.push({
          x: Math.sin(phi) * Math.cos(theta),
          y: Math.sin(phi) * Math.sin(theta),
          z: Math.cos(phi)
        });
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize);

      function draw() {
        const light = document.documentElement.classList.contains('light');
        ctx.clearRect(0, 0, w, h);

        angleX += 0.002;
        angleY += 0.001;
        const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
        const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

        const radius = Math.min(w, h) * 0.65;
        const cx = w * 0.72, cy = h * 0.48;
        const projected = [];

        for (let i = 0; i < NUM; i++) {
          const p = points[i];
          // rotate around Y
          let x1 = p.x * cosY - p.z * sinY;
          let z1 = p.x * sinY + p.z * cosY;
          let y1 = p.y;
          // rotate around X
          let y2 = y1 * cosX - z1 * sinX;
          let z2 = y1 * sinX + z1 * cosX;

          const scale = 1 / (3 - z2);
          const sx = cx + x1 * radius * scale;
          const sy = cy + y2 * radius * scale;
          const depth = (z2 + 1) / 2; // 0 to 1
          projected.push({ sx, sy, depth, z: z2 });
        }

        // sort back-to-front
        projected.sort((a, b) => a.z - b.z);

        for (const p of projected) {
          const alpha = 0.07 + p.depth * 0.3;
          const r = 1.0 + p.depth * 2.0;
          const c = light ? sphereColor.light : sphereColor.dark;
          ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${light ? alpha * 0.7 : alpha})`;
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const delay = parseInt(entry.target.dataset.delay || 0);
          setTimeout(() => entry.target.classList.add('visible'), delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.post-item').forEach(el => observer.observe(el));
  </script>
</body>
</html>
