---
layout: null
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claire Shin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #17150f;
      --text: #ece5d3;
      --text-mid: rgba(236,229,211,0.52);
      --text-dim: rgba(236,229,211,0.32);
      --card-bg: rgba(236,229,211,0.03);
      --card-border: rgba(236,229,211,0.1);
      --card-desc: rgba(236,229,211,0.55);
      --shadow-hover: rgba(0,0,0,0.35);
      --accent: #c1893f;
      --accent-dim: rgba(193,137,63,0.35);
    }
    :root.light {
      --bg: #f3ede0;
      --text: #33301f;
      --text-mid: rgba(51,48,31,0.55);
      --text-dim: rgba(51,48,31,0.38);
      --card-bg: rgba(51,48,31,0.03);
      --card-border: rgba(51,48,31,0.12);
      --card-desc: rgba(51,48,31,0.6);
      --shadow-hover: rgba(51,48,31,0.1);
      --accent: #93601f;
      --accent-dim: rgba(147,96,31,0.3);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── NAV ── */
    .nav {
      padding: 22px 32px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      transition: border-color 0.4s ease;
    }
    .nav-left a {
      color: var(--text);
      text-decoration: none;
      font-family: 'Fraunces', Georgia, serif;
      font-size: 19px;
      font-style: italic;
      font-weight: 500;
    }
    .nav-links { display: flex; align-items: center; gap: 22px; }
    .nav-links a {
      color: var(--text-mid);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--accent); }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      color: var(--text-dim);
      transition: color 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .theme-toggle:hover { color: var(--accent); }

    /* ── HEADER ── */
    .header {
      padding: 56px 32px 40px;
      max-width: 860px;
      margin: 0 auto;
    }
    .header p {
      font-family: 'Fraunces', Georgia, serif;
      font-style: italic;
      font-size: 22px;
      color: var(--text-mid);
      font-weight: 400;
    }

    /* ── POSTS ── */
    .posts {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 32px 80px;
    }
    .posts-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--card-border);
    }
    .posts-label {
      font-size: 13px;
      letter-spacing: 0.5px;
      color: var(--text-dim);
    }
    .topic-filters {
      display: flex;
      gap: 18px;
    }
    .topic-btn {
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      padding: 0 0 4px;
      border: none;
      border-bottom: 1px solid transparent;
      background: none;
      color: var(--text-dim);
      cursor: pointer;
      transition: color 0.3s, border-color 0.3s;
    }
    .topic-btn:hover { color: var(--text); }
    .topic-btn.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }
    .topic-btn[data-filter="finance"].active { border-bottom-color: #4f7a5c; }
    .topic-btn[data-filter="ml"].active { border-bottom-color: #a8503a; }
    .post-item.hidden {
      display: none;
    }
    .post-item {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 24px 4px;
      border-bottom: 1px solid var(--card-border);
      transition: border-color 0.3s ease, padding-left 0.3s ease;
      opacity: 0;
      transform: translateY(14px);
    }
    .post-item.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .post-item:hover {
      padding-left: 14px;
      border-bottom-color: var(--accent-dim);
    }
    .post-item[data-topic="finance"]:hover { border-bottom-color: rgba(79,122,92,0.5); }
    .post-item[data-topic="ml"]:hover { border-bottom-color: rgba(168,80,58,0.5); }
    .post-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    .post-title {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(20px, 2.4vw, 25px);
      font-weight: 400;
      line-height: 1.3;
      margin-bottom: 8px;
      transition: color 0.3s;
    }
    .post-item:hover .post-title { color: var(--accent); }
    .post-item[data-topic="finance"]:hover .post-title { color: #4f7a5c; }
    .post-item[data-topic="ml"]:hover .post-title { color: #a8503a; }
    .post-excerpt {
      font-size: 15px;
      line-height: 1.7;
      color: var(--card-desc);
      font-weight: 300;
    }

    /* ── PARTICLE BG ── */
    #particle-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .nav, .header, .posts { position: relative; z-index: 1; }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .header, .posts { padding-left: 20px; padding-right: 20px; }
      .nav { padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <canvas id="particle-bg"></canvas>
  <nav class="nav">
    <div class="nav-left"><a href="/">Claire Shin</a></div>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/about/">About</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
        <span class="icon" id="theme-icon">☀</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </nav>

  <div class="header">
    <p>Learning notes.</p>
  </div>

  <div class="posts">
    <div class="posts-header">
      <div class="posts-label">Writing</div>
      <div class="topic-filters">
        <button class="topic-btn active" data-filter="all">All</button>
        <button class="topic-btn" data-filter="finance">Finance</button>
        <button class="topic-btn" data-filter="ml">ML</button>
      </div>
    </div>
    {% for post in site.posts %}
    <a class="post-item" href="{{ post.url }}" data-delay="{{ forloop.index0 | times: 80 }}" data-topic="{{ post.topic }}">
      <div class="post-date">{{ post.date | date: "%B %d, %Y" }}</div>
      <div class="post-title">{{ post.title }}</div>
      <div class="post-excerpt">{{ post.content | strip_html | truncatewords: 40 }}</div>
    </a>
    {% endfor %}
  </div>

  <script>
    // Theme toggle
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    const root = document.documentElement;
    function setTheme(mode) {
      if (mode === 'light') { root.classList.add('light'); icon.textContent = '☾'; label.textContent = 'Dark'; }
      else { root.classList.remove('light'); icon.textContent = '☀'; label.textContent = 'Light'; }
      localStorage.setItem('theme', mode);
    }
    toggle.addEventListener('click', () => setTheme(root.classList.contains('light') ? 'dark' : 'light'));
    const saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);

    // ═══════════════ SPHERE COLOR STATE ═══════════════
    const SPHERE_COLORS = {
      all:     { dark: [193,137,63],  light: [147,96,31] },
      finance: { dark: [79,122,92],   light: [58,96,68] },
      ml:      { dark: [168,80,58],   light: [140,62,42] },
    };
    let sphereColor = SPHERE_COLORS.all;

    // ═══════════════ PARTICLE SPHERE ═══════════════
    (function() {
      const canvas = document.getElementById('particle-bg');
      const ctx = canvas.getContext('2d');
      let w, h, dpr;
      const NUM = 1400;
      const points = [];
      let angleX = 0, angleY = 0;

      // generate points on a sphere using fibonacci spiral
      for (let i = 0; i < NUM; i++) {
        const phi = Math.acos(1 - 2 * (i + 0.5) / NUM);
        const theta = Math.PI * (1 + Math.sqrt(5)) * i;
        points.push({
          x: Math.sin(phi) * Math.cos(theta),
          y: Math.sin(phi) * Math.sin(theta),
          z: Math.cos(phi)
        });
      }

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.scale(dpr, dpr);
      }
      resize();
      window.addEventListener('resize', resize);

      function draw() {
        const light = document.documentElement.classList.contains('light');
        ctx.clearRect(0, 0, w, h);

        angleX += 0.002;
        angleY += 0.001;
        const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
        const cosY = Math.cos(angleY), sinY = Math.sin(angleY);

        const radius = Math.min(w, h) * 0.65;
        const cx = w * 0.72, cy = h * 0.48;
        const projected = [];

        for (let i = 0; i < NUM; i++) {
          const p = points[i];
          // rotate around Y
          let x1 = p.x * cosY - p.z * sinY;
          let z1 = p.x * sinY + p.z * cosY;
          let y1 = p.y;
          // rotate around X
          let y2 = y1 * cosX - z1 * sinX;
          let z2 = y1 * sinX + z1 * cosX;

          const scale = 1 / (3 - z2);
          const sx = cx + x1 * radius * scale;
          const sy = cy + y2 * radius * scale;
          const depth = (z2 + 1) / 2; // 0 to 1
          projected.push({ sx, sy, depth, z: z2 });
        }

        // sort back-to-front
        projected.sort((a, b) => a.z - b.z);

        for (const p of projected) {
          const alpha = 0.04 + p.depth * 0.2;
          const r = 0.6 + p.depth * 1.6;
          const c = light ? sphereColor.light : sphereColor.dark;
          ctx.fillStyle = `rgba(${c[0]},${c[1]},${c[2]},${light ? alpha * 0.5 : alpha})`;
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2);
          ctx.fill();
        }

        requestAnimationFrame(draw);
      }
      draw();
    })();

    // Topic filter
    document.querySelectorAll('.topic-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        sphereColor = SPHERE_COLORS[filter] || SPHERE_COLORS.all;
        document.querySelectorAll('.post-item').forEach(item => {
          if (filter === 'all' || item.dataset.topic === filter) {
            item.classList.remove('hidden');
          } else {
            item.classList.add('hidden');
          }
        });
      });
    });

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const delay = parseInt(entry.target.dataset.delay || 0);
          setTimeout(() => entry.target.classList.add('visible'), delay);
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    document.querySelectorAll('.post-item').forEach(el => observer.observe(el));
  </script>
</body>
</html>
