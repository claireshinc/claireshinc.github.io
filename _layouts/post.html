<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Claire Shin</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Work+Sans:ital,wght@0,300;0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #17150f;
      --text: #ece5d3;
      --text-mid: rgba(236,229,211,0.52);
      --text-dim: rgba(236,229,211,0.32);
      --card-border: rgba(236,229,211,0.1);
      --link-color: #c1893f;
      --code-bg: rgba(236,229,211,0.06);
    }
    :root.light {
      --bg: #f3ede0;
      --text: #33301f;
      --text-mid: rgba(51,48,31,0.55);
      --text-dim: rgba(51,48,31,0.38);
      --card-border: rgba(51,48,31,0.12);
      --link-color: #93601f;
      --code-bg: rgba(51,48,31,0.06);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Work Sans', system-ui, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ── NAV ── */
    .nav {
      padding: 22px 32px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      transition: border-color 0.4s ease;
    }
    .nav-links { display: flex; align-items: center; gap: 22px; }
    .nav a {
      color: var(--text-mid);
      text-decoration: none;
      font-size: 14px;
      transition: color 0.3s;
    }
    .nav a:hover { color: var(--link-color); }
    .theme-toggle {
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Work Sans', sans-serif;
      font-size: 13px;
      color: var(--text-dim);
      transition: color 0.3s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .theme-toggle:hover { color: var(--link-color); }

    /* ── ARTICLE ── */
    .article {
      max-width: 660px;
      margin: 0 auto;
      padding: 60px 32px 80px;
    }
    .article-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .article h1 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 400;
      font-style: italic;
      line-height: 1.2;
      margin-bottom: 40px;
    }

    /* ── PROSE ── */
    .prose {
      font-size: 17px;
      line-height: 1.85;
      font-weight: 300;
    }
    .prose p { margin-bottom: 24px; }
    .prose h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 24px;
      font-weight: 400;
      margin: 48px 0 20px;
    }
    .prose h3 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 20px;
      font-weight: 400;
      margin: 36px 0 16px;
    }
    .prose a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.3s;
    }
    .prose a:hover { border-bottom-color: var(--link-color); }
    .prose strong { font-weight: 600; }
    .prose em { color: var(--text-mid); }
    .prose ul, .prose ol {
      margin: 0 0 24px 24px;
    }
    .prose li { margin-bottom: 8px; }
    .prose blockquote {
      border-left: 2px solid var(--card-border);
      padding-left: 20px;
      margin: 24px 0;
      color: var(--text-mid);
      font-style: italic;
    }
    .prose code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      background: var(--code-bg);
      padding: 2px 6px;
    }
    .prose pre {
      background: var(--code-bg);
      padding: 20px;
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--card-border);
    }
    .prose pre code {
      background: none;
      padding: 0;
    }
    .prose img {
      max-width: 100%;
      margin: 24px 0;
    }
    .prose hr {
      border: none;
      height: 1px;
      background: var(--card-border);
      margin: 40px 0;
    }

    /* ── BACK LINK ── */
    .back {
      max-width: 660px;
      margin: 0 auto;
      padding: 0 32px 60px;
    }
    .back a {
      font-size: 14px;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.3s;
    }
    .back a:hover { color: var(--link-color); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .article, .back { padding-left: 20px; padding-right: 20px; }
      .nav { padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/">← Home</a>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/about/">About</a>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
        <span class="icon" id="theme-icon">☀</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </nav>

  <article class="article">
    <div class="article-date">{{ page.date | date: "%B %d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    <div class="prose">
      {{ content }}
    </div>
  </article>

  <div class="back">
    <a href="/">← All posts</a>
  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    const root = document.documentElement;
    function setTheme(mode) {
      if (mode === 'light') { root.classList.add('light'); icon.textContent = '☾'; label.textContent = 'Dark'; }
      else { root.classList.remove('light'); icon.textContent = '☀'; label.textContent = 'Light'; }
      localStorage.setItem('theme', mode);
    }
    toggle.addEventListener('click', () => setTheme(root.classList.contains('light') ? 'dark' : 'light'));
    const saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);
  </script>
</body>
</html>
