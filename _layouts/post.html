<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page.title }} — Claire Shin</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0A1428;
      --heading: #B7CBE8;
      --text: #E8ECF2;
      --text-mid: rgba(232,236,242,0.62);
      --text-dim: rgba(232,236,242,0.4);
      --card-border: rgba(232,236,242,0.16);
      --link-color: #8ECDF0;
      --code-bg: rgba(232,236,242,0.07);
    }
    :root.light {
      --bg: #eef2f7;
      --heading: #00205B;
      --text: #0A1E3F;
      --text-mid: #5B6770;
      --text-dim: rgba(10,30,63,0.42);
      --card-border: #D9DDE3;
      --link-color: #3E9FD8;
      --code-bg: #F4F6F8;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* ── NAV ── */
    .nav {
      padding: 22px 32px;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      transition: border-color 0.3s ease;
    }
    .nav-links { display: flex; align-items: center; gap: 24px; }
    .nav a {
      color: var(--text-mid);
      text-decoration: none;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    .nav a:hover { color: var(--link-color); }
    .theme-toggle {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 0;
      cursor: pointer;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 6px 10px;
      transition: color 0.2s, border-color 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-toggle:hover { color: var(--link-color); border-color: var(--link-color); }
    .hl-toggle {
      background: none;
      border: 1px solid var(--card-border);
      border-radius: 0;
      cursor: pointer;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-mid);
      padding: 6px 10px;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .hl-toggle:hover { color: var(--link-color); border-color: var(--link-color); }
    .hl-toggle.on {
      background: var(--link-color);
      border-color: var(--link-color);
      color: var(--bg);
    }

    /* ── ARTICLE ── */
    .article {
      max-width: 820px;
      margin: 0 auto;
      padding: 60px 32px 80px;
    }
    .article-date {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-style: italic;
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 12px;
    }
    .article h1 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: clamp(28px, 5vw, 36px);
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.2;
      color: var(--heading);
      margin-bottom: 40px;
    }

    .content-box {
      border: 1px solid var(--card-border);
      background: transparent;
      padding: 36px;
    }

    /* ── PROSE ── */
    .prose, .prose * {
      font-family: "Helvetica Neue", Helvetica, Arial, -apple-system, sans-serif;
    }
    .prose {
      font-size: 16.5px;
      line-height: 1.8;
      font-weight: 400;
    }
    .prose p { margin-bottom: 22px; }
    .prose h2 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--heading);
      margin: 46px 0 18px;
    }
    .prose h3 {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--heading);
      margin: 34px 0 14px;
    }
    .prose a {
      color: var(--link-color);
      text-decoration: none;
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .prose a:hover { border-bottom-color: var(--link-color); }
    .prose strong { font-weight: 700; }
    .prose em { color: var(--text-mid); }
    .prose ul, .prose ol {
      margin: 0 0 22px 24px;
    }
    .prose li { margin-bottom: 8px; }
    .prose blockquote {
      border-left: 3px solid var(--link-color);
      padding-left: 20px;
      margin: 24px 0;
      color: var(--text-mid);
      font-style: italic;
    }
    .prose code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 13.5px;
      background: var(--code-bg);
      padding: 2px 6px;
    }
    .prose pre {
      background: var(--code-bg);
      padding: 20px;
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--card-border);
    }
    .prose pre code {
      background: none;
      padding: 0;
    }
    .prose img {
      max-width: 100%;
      margin: 24px 0;
    }
    .prose hr {
      border: none;
      height: 1px;
      background: var(--card-border);
      margin: 40px 0;
    }
    .prose mark.uhl {
      background: rgba(255,214,51,0.85);
      color: #1a1a1a;
      padding: 0 1px;
      cursor: pointer;
    }
    body.hl-mode .prose { cursor: text; }

    /* ── BACK LINK ── */
    .back {
      max-width: 820px;
      margin: 0 auto;
      padding: 0 32px 60px;
    }
    .back a {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      text-decoration: none;
      transition: color 0.2s;
    }
    .back a:hover { color: var(--link-color); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      .article, .back { padding-left: 20px; padding-right: 20px; }
      .nav { padding: 18px 20px; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <a href="/">Home</a>
    <div class="nav-links">
      <a href="/projects/">Projects</a>
      <a href="/about/">About</a>
      <button class="hl-toggle" id="hl-toggle" aria-pressed="false" title="Select text to highlight it">Highlight</button>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode">
        <span class="icon" id="theme-icon">☀</span>
        <span id="theme-label">Light</span>
      </button>
    </div>
  </nav>

  <article class="article">
    <div class="article-date">{{ page.date | date: "%B %d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    <div class="content-box">
      <div class="prose">
        {{ content }}
      </div>
    </div>
  </article>

  <div class="back">
    <a href="/">← All posts</a>
  </div>

  <script>
    const toggle = document.getElementById('theme-toggle');
    const icon = document.getElementById('theme-icon');
    const label = document.getElementById('theme-label');
    const root = document.documentElement;
    function setTheme(mode) {
      if (mode === 'light') { root.classList.add('light'); icon.textContent = '☾'; label.textContent = 'Dark'; }
      else { root.classList.remove('light'); icon.textContent = '☀'; label.textContent = 'Light'; }
      localStorage.setItem('theme', mode);
    }
    toggle.addEventListener('click', () => setTheme(root.classList.contains('light') ? 'dark' : 'light'));
    const saved = localStorage.getItem('theme');
    if (saved) setTheme(saved);

    // ═══════════════ HIGHLIGHTER ═══════════════
    (function() {
      const hlBtn = document.getElementById('hl-toggle');
      const prose = document.querySelector('.prose');
      const storeKey = 'highlights:' + location.pathname;
      let hlMode = false;

      function setHlMode(on) {
        hlMode = on;
        document.body.classList.toggle('hl-mode', on);
        hlBtn.classList.toggle('on', on);
        hlBtn.setAttribute('aria-pressed', String(on));
        hlBtn.textContent = on ? 'Highlighting' : 'Highlight';
      }
      hlBtn.addEventListener('click', () => setHlMode(!hlMode));

      function saveHighlights() {
        try { sessionStorage.setItem(storeKey, prose.innerHTML); } catch (e) {}
      }

      function wrapSelection() {
        const sel = window.getSelection();
        if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
        const range = sel.getRangeAt(0);
        if (!prose.contains(range.commonAncestorContainer)) return;
        if (range.toString().trim() === '') return;
        const mark = document.createElement('mark');
        mark.className = 'uhl';
        try {
          range.surroundContents(mark);
        } catch (e) {
          const frag = range.extractContents();
          mark.appendChild(frag);
          range.insertNode(mark);
        }
        sel.removeAllRanges();
        saveHighlights();
      }

      prose.addEventListener('mouseup', () => {
        if (!hlMode) return;
        setTimeout(wrapSelection, 0);
      });

      prose.addEventListener('click', (e) => {
        const mark = e.target.closest('mark.uhl');
        if (!mark) return;
        const parent = mark.parentNode;
        while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
        parent.removeChild(mark);
        parent.normalize();
        saveHighlights();
      });

      try {
        const savedHl = sessionStorage.getItem(storeKey);
        if (savedHl) prose.innerHTML = savedHl;
      } catch (e) {}
    })();
  </script>
</body>
</html>
