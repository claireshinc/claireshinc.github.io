const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a)));
async function open_(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function derive(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
(async()=>{let k=null;try{k=localStorage.getItem(KK)}catch(e){}
  if(k){try{await open_(await crypto.subtle.importKey('raw',u8(k),'AES-GCM',true,['decrypt']));return}catch(e){try{localStorage.removeItem(KK)}catch(_){}}}
})();
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();const m=document.getElementById('msg');m.textContent='여는 중…';
  try{const key=await derive(document.getElementById('pw').value);
    const raw=await crypto.subtle.exportKey('raw',key);
    await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(P.i)},key,u8(P.c));
    if(document.getElementById('rem').checked){try{localStorage.setItem(KK,b64(raw))}catch(_){}}
    await open_(key);
  }catch(err){m.textContent='비밀번호가 달라요';}
};
